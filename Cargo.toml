# smtlite - a small, pure-Rust QF_BV SMT solver.
#
# No external solver, no C, no `unsafe`: a bitvector expression DAG is bit-blasted to CNF and
# handed to a self-contained DPLL SAT core, and a satisfying assignment is read back as concrete
# bitvector values. Scoped to the DIRECTED, single-function queries a caller asks in bulk -
# not general-purpose theorem proving - so it stays small and dependency-free.
#
# This manifest is deliberately self-contained (no `{ workspace = true }` fields), so the crate
# builds and publishes identically whether it is pulled in as a dependency or checked out alone.
[package]
name = "smtlite"
version = "0.1.1"
edition = "2024"
rust-version = "1.85"
license = "Apache-2.0"
description = "A small, pure-Rust QF_BV SMT solver: bitvector expressions bit-blasted to CNF and solved by a self-contained DPLL core."
readme = "README.md"
repository = "https://github.com/Sing-Security/smtlite"
homepage = "https://github.com/Sing-Security/smtlite"
documentation = "https://docs.rs/smtlite"
keywords = ["smt", "solver", "bitvector", "sat", "symbolic-execution"]
categories = ["algorithms", "development-tools"]
publish = true
exclude = ["**/*.rs.bk"]

[dependencies]
# The sole dependency: a bump arena for the bit-blaster's per-solve CNF clauses (thousands of tiny,
# same-lifetime allocations freed together). Pure Rust, no C - the crate's "no external solver, no C"
# principle holds; this is an allocator, not a solver.
bumpalo = { version = "3", features = ["collections"] }

[lints.rust]
# Declared here rather than in a `#![...]` attribute so the same settings apply when this
# manifest is the crate root on its own, with no enclosing workspace to inherit from.
#
# No `unsafe` anywhere in this crate.
unsafe_code = "forbid"
# Every public item carries a doc comment.
missing_docs = "warn"
